# fly.toml app configuration file generated for elixir-havannah on 2026-04-30T22:25:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elixir-havannah'
primary_region = 'dfw'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'havannah.slowinput.org'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
